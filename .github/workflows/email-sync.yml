name: Email sync

# Polls the company mailbox (IMAP) for new mail and pulls it into the admin
# dashboard's mini-inbox, matched to customers by sender address.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger inbox sync
        run: |
          curl -sf --max-time 30 -X POST \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://lindqvistholmgren.se/api/cron/email-sync > /dev/null
