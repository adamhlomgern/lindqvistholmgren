  <text x="206" y="140" font-family="Arial, sans-serif" font-size="13" fill="#2F4A38">Varm benvit</text>

  <rect x="368" y="24" width="208" height="150" fill="#FFFFFF" stroke="#D8CBA8" stroke-width="1"/>
